<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonrise Photo Moderation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #F1E6CF;
    --foam: #F8F2E4;
    --ink: #1F3347;
    --ink-soft: #4C6478;
    --coral: #C97456;
    --coral-dark: #A85C42;
    --aqua: #5FADA6;
    --navy: #2C4A63;
    --navy-dark: #1B2E3F;
    --driftwood: #A68A6D;
    --line: rgba(31, 51, 71, 0.14);
    --good: #3E7A5C;

    --display: 'Bungee', system-ui, sans-serif;
    --heading: 'Fraunces', Georgia, serif;
    --body: 'Work Sans', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  .admin-nav { text-align: center; font-size: 12.5px; margin: 0 0 10px; }
  .admin-nav a { color: var(--navy); font-weight: 600; text-decoration: none; }
  .admin-nav a:hover { text-decoration: underline; }

  header.top {
    text-align: center;
    padding: 28px 20px 22px;
    background:
      radial-gradient(ellipse 500px 260px at 50% -20%, rgba(44,74,99,0.14), transparent 60%),
      linear-gradient(180deg, var(--sand) 0%, var(--sand) 100%);
  }
  h1.brand {
    font-family: var(--display);
    font-size: 20px;
    margin: 0;
    color: var(--ink);
    text-shadow: 2px 2px 0 var(--navy);
    letter-spacing: 0.01em;
  }
  .subhead { color: var(--ink-soft); font-size: 13.5px; margin: 8px 0 0; }

  .loading, .empty { text-align: center; color: var(--ink-soft); padding: 40px 10px; font-size: 14.5px; }

  .photo-card {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 4px 4px 0 rgba(20,48,45,0.10);
  }
  .photo-card img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
    display: block;
    margin-bottom: 12px;
  }
  .photo-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .photo-name { font-weight: 700; font-size: 15px; }
  .photo-date { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .photo-caption { font-size: 14.5px; color: var(--ink); margin: 0 0 12px; white-space: pre-wrap; }

  .photo-actions { display: flex; gap: 10px; }
  .action-btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    font-family: var(--body);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
  }
  .approve-btn { background: var(--good); color: #fff; border-color: var(--good); }
  .approve-btn:hover { filter: brightness(1.08); }
  .reject-btn { background: #fff; color: var(--coral-dark); border-color: var(--coral-dark); }
  .reject-btn:hover { background: var(--foam); }
  .action-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header class="top">
  <p class="admin-nav"><a href="../">&larr; All Admin Pages</a></p>
  <h1 class="brand">Moonrise Photo Moderation</h1>
  <p class="subhead">Unlisted page &mdash; approve or reject photos submitted at /moonrise/submit/</p>
</header>

<div class="wrap">
  <div class="loading" id="loadingMsg">Loading pending photos&hellip;</div>
  <div id="photoList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getStorage, ref, listAll, deleteObject, uploadBytes } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm6S3mhAmLobxa5ID3uW6IUJTBcwK_zwM",
    authDomain: "waveclock.firebaseapp.com",
    projectId: "waveclock",
    storageBucket: "waveclock.firebasestorage.app",
    messagingSenderId: "668302334840",
    appId: "1:668302334840:web:6a18ae2df23455e9dc468d"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);

  const loadingMsg = document.getElementById("loadingMsg");
  const photoList = document.getElementById("photoList");

  function storageUrl(path) {
    return "https://firebasestorage.googleapis.com/v0/b/" + firebaseConfig.storageBucket + "/o/" + encodeURIComponent(path) + "?alt=media";
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    } catch (e) {
      return "";
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadPending() {
    let items;
    try {
      const listing = await listAll(ref(storage, "moonrise/pending"));
      items = listing.items.filter((item) => item.name.endsWith(".json"));
    } catch (err) {
      loadingMsg.textContent = "Couldn't load photos. Refresh to try again.";
      return;
    }

    if (items.length === 0) {
      loadingMsg.textContent = "";
      photoList.innerHTML = '<div class="empty">No photos waiting for approval.</div>';
      return;
    }

    const entries = [];
    for (const item of items) {
      try {
        const resp = await fetch(storageUrl(item.fullPath));
        if (!resp.ok) continue;
        entries.push(await resp.json());
      } catch (err) {
        // skip unreadable entries
      }
    }
    entries.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    loadingMsg.textContent = "";
    if (entries.length === 0) {
      photoList.innerHTML = '<div class="empty">No photos waiting for approval.</div>';
      return;
    }

    entries.forEach(renderEntry);
  }

  function renderEntry(entry) {
    const card = document.createElement("div");
    card.className = "photo-card";
    card.dataset.id = entry.id;

    const captionHtml = entry.caption ? `<p class="photo-caption">${escapeHtml(entry.caption)}</p>` : "";

    card.innerHTML = `
      <div class="photo-top">
        <span class="photo-name">${entry.name ? escapeHtml(entry.name) : "Anonymous"}</span>
        <span class="photo-date">${formatDate(entry.createdAt)}</span>
      </div>
      <img src="${storageUrl("moonrise/pending/" + entry.id + ".jpg")}" alt="Submitted moonrise photo">
      ${captionHtml}
      <div class="photo-actions">
        <button type="button" class="action-btn approve-btn">Approve</button>
        <button type="button" class="action-btn reject-btn">Reject</button>
      </div>
    `;

    card.querySelector(".approve-btn").addEventListener("click", () => handleApprove(entry, card));
    card.querySelector(".reject-btn").addEventListener("click", () => handleReject(entry, card));

    photoList.appendChild(card);
  }

  function setBusy(card, busy) {
    card.querySelectorAll(".action-btn").forEach((btn) => (btn.disabled = busy));
  }

  async function handleApprove(entry, card) {
    setBusy(card, true);
    try {
      const jsonBlob = new Blob([JSON.stringify(entry)], { type: "application/json" });
      await uploadBytes(ref(storage, "moonrise/approved/" + entry.id + ".json"), jsonBlob, { contentType: "application/json" });

      const photoResp = await fetch(storageUrl("moonrise/pending/" + entry.id + ".jpg"));
      const photoBlob = await photoResp.blob();
      await uploadBytes(ref(storage, "moonrise/approved/" + entry.id + ".jpg"), photoBlob, { contentType: "image/jpeg" });

      await deleteObject(ref(storage, "moonrise/pending/" + entry.id + ".json"));
      await deleteObject(ref(storage, "moonrise/pending/" + entry.id + ".jpg")).catch(() => {});

      card.remove();
      if (!photoList.children.length) {
        photoList.innerHTML = '<div class="empty">No photos waiting for approval.</div>';
      }
    } catch (err) {
      setBusy(card, false);
      alert("Couldn't approve this photo — try again.");
    }
  }

  async function handleReject(entry, card) {
    if (!confirm("Reject and delete this photo?")) return;
    setBusy(card, true);
    try {
      await deleteObject(ref(storage, "moonrise/pending/" + entry.id + ".json"));
      await deleteObject(ref(storage, "moonrise/pending/" + entry.id + ".jpg")).catch(() => {});
      card.remove();
      if (!photoList.children.length) {
        photoList.innerHTML = '<div class="empty">No photos waiting for approval.</div>';
      }
    } catch (err) {
      setBusy(card, false);
      alert("Couldn't reject this photo — try again.");
    }
  }

  loadPending();
</script>

</body>
</html>
