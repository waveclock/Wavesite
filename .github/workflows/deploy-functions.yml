name: Deploy Firebase Functions

# Runs functions/'s tests, then deploys to Firebase automatically whenever
# functions/ changes on main -- so a merged PR ships itself instead of
# needing "git pull && firebase deploy --only functions" run by hand.
# workflow_dispatch lets it be triggered manually too (e.g. from GitHub's
# mobile web UI, or via the Actions API), for a deploy that isn't tied to
# a fresh push -- e.g. re-running after a transient failure.
#
# Needs one repo secret to work: FIREBASE_SERVICE_ACCOUNT, a Google Cloud
# service account key (JSON) with permission to deploy Cloud Functions
# for the waveclock Firebase project. See functions/README.md for how to
# create it.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Run tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx firebase-tools@13 deploy --only functions --project waveclock --non-interactive
