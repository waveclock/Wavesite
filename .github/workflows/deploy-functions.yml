name: Deploy Firebase Functions

# Runs functions/'s tests, then deploys to Firebase automatically whenever
# functions/ changes on main -- so a merged PR ships itself instead of
# needing "git pull && firebase deploy --only functions" run by hand.
# workflow_dispatch lets it be triggered manually too (e.g. from GitHub's
# mobile web UI, or via the Actions API), for a deploy that isn't tied to
# a fresh push -- e.g. re-running after a transient failure.
#
# Needs two repo secrets to work:
# - FIREBASE_SERVICE_ACCOUNT, a Google Cloud service account key (JSON)
#   with permission to deploy Cloud Functions for the waveclock Firebase
#   project. See functions/README.md for how to create it.
# - WAVECLOCK_MINT_SECRET, the value mintTideTagBatch (see functions/
#   index.js) checks against -- written out to functions/.env.waveclock
#   (gitignored, never committed) right before deploying, which Firebase
#   auto-loads as a plain runtime env var for every function in this
#   codebase. Deliberately NOT a Secret Manager-backed secret (see that
#   same comment in index.js for why) -- a repo secret here gives the
#   exact same "never in the repo" guarantee without it.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # node-canvas (functions/'s drawing dependency) ships prebuilt
      # binaries for specific Node ABI versions; none exists yet for
      # Node 22 on this runner's platform, so npm ci falls back to
      # compiling it from source, which needs these system libraries --
      # see node-canvas's own "Compiling" docs
      # (https://github.com/Automattic/node-canvas#compiling). Not
      # needed before the Node 20 bump since a Node 20 prebuilt existed.
      - name: Install node-canvas build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Run tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Written fresh on every run, from the repo secret -- never committed
      # (functions/.env.waveclock is gitignored). GitHub automatically masks
      # this value in logs wherever it would otherwise appear, same as any
      # other ${{ secrets.* }} reference.
      - name: Write the mint secret's env file
        working-directory: functions
        run: echo "WAVECLOCK_MINT_SECRET=${{ secrets.WAVECLOCK_MINT_SECRET }}" > .env.waveclock

      - name: Deploy to Firebase
        run: npx firebase-tools@13 deploy --only functions --project waveclock --non-interactive
