<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>More Screens &mdash; Wave Clock Tide</title>
<link rel="icon" href="/logo.png">
<style>
  /*
    "More Screens" -- the gallery for keychain-only extras (404.html's
    own "More Screens" button links here with ?tagId=...). Same palette/
    chrome as 404.html itself (the page this always arrives from and
    returns to), not design/index.html's Design-tool palette -- these
    are two different parts of the site a visitor never confuses.

    Deliberately a tiny, self-contained OPTIONS array (Song List and
    Live Video Feed today) rather than a generic framework -- see
    OPTIONS' own comment below for what adding another gallery item
    actually requires.
  */
  :root {
    --ink: #0f1b3d;
    --soft: #4a5675;
    --line: #d9dee9;
    --wave: #1f5fd1;
    --wave-pale: #e7effc;
    --bg: #ffffff;
    --bad: #b4361b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  button, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  a { color: var(--wave); }

  .top { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 2px solid var(--line); }
  .back-link { display: flex; align-items: center; gap: 4px; text-decoration: none; color: var(--wave); font-weight: 700; font-size: 15px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subhead { color: var(--soft); font-size: 15px; margin: 0 0 22px; }

  .card { border: 2px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .card-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--wave-pale); display: flex; align-items: center; justify-content: center; flex: none; }
  .card-title { font-size: 17px; font-weight: 700; margin: 0; }
  .card-desc { color: var(--soft); font-size: 14px; margin: 6px 0 0; line-height: 1.4; }
  .card-badge { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--wave); background: var(--wave-pale); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }

  .card-form { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .card-form label { display: block; font-size: 13px; font-weight: 700; color: var(--soft); margin-bottom: 6px; }
  .card-form input[type="text"] { width: 100%; padding: 11px 12px; border: 2px solid var(--line); border-radius: 8px; font-size: 16px; }
  .card-form input[type="text"]:focus { outline: none; border-color: var(--wave); }
  .card-actions { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .btn-primary { background: var(--wave); color: #fff; }
  .btn-primary:disabled { background: var(--line); color: var(--soft); cursor: default; }
  .btn-text { background: none; color: var(--bad); padding: 10px 4px; }
  .form-status { font-size: 13px; color: var(--soft); margin: 0; flex-basis: 100%; }
  .form-status.error { color: var(--bad); }
</style>
</head>
<body>
<div class="top">
  <a class="back-link" id="backLink" href="../">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>
</div>
<h1>More Screens</h1>
<p class="subhead">Add extra panels to your keychain's tide page.</p>

<div id="cardList"></div>
<p id="pageStatus" class="form-status"></p>

<script type="module">
  const tagId = new URLSearchParams(location.search).get('tagId') || '';
  // Same shape lib/tideTag.js's TAG_ID_PATTERN validates server-side --
  // duplicated here only so a malformed/missing tagId (a stale bookmark,
  // a hand-edited URL) shows a clear message instead of a confusing
  // network error from the proxy.
  const TAG_ID_PATTERN = /^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{16,32}$/;
  const KEYCHAIN_SCREENS_PROXY = 'https://us-central1-waveclock.cloudfunctions.net/keychainScreensProxy';

  const backLink = document.getElementById('backLink');
  if (TAG_ID_PATTERN.test(tagId)) backLink.href = '../t/' + tagId;

  const cardList = document.getElementById('cardList');
  const pageStatus = document.getElementById('pageStatus');

  if (!TAG_ID_PATTERN.test(tagId)) {
    pageStatus.textContent = "Couldn't tell which keychain this is for -- open More Screens from your tide page again.";
    pageStatus.classList.add('error');
    throw new Error('missing/invalid tagId');
  }

  async function fetchScreens() {
    const r = await fetch(KEYCHAIN_SCREENS_PROXY + '?tagId=' + encodeURIComponent(tagId));
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j && j.error) || ('http ' + r.status));
    return Array.isArray(j.screens) ? j.screens : [];
  }

  async function saveScreens(nextScreens) {
    const r = await fetch(KEYCHAIN_SCREENS_PROXY, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tagId, screens: nextScreens })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j && j.error) || ('http ' + r.status));
    return Array.isArray(j.screens) ? j.screens : [];
  }

  // ---------------------------------------------------------------------
  // Same YouTube playlist/video link parsing as lib/keychainScreens.js's
  // own extractYoutubeMusicRef -- duplicated client-side (this project's
  // established no-build-step convention, see dynamic.js's own header
  // comment) just to give an immediate "that doesn't look like a
  // YouTube link" instead of waiting on a round trip for the same
  // rejection the server would give anyway.
  // ---------------------------------------------------------------------
  const PLAYLIST_ID_PATTERN = /^[A-Za-z0-9_-]{10,64}$/;
  const VIDEO_ID_PATTERN = /^[A-Za-z0-9_-]{11}$/;
  const YOUTUBE_HOSTS = new Set(['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com', 'youtu.be']);
  function extractYoutubeMusicRefClient(input) {
    const trimmed = (input || '').trim();
    if (!trimmed) return null;
    try {
      const u = new URL(trimmed);
      const host = u.hostname.toLowerCase();
      if (!YOUTUBE_HOSTS.has(host)) return null;
      const pathVideo = host === 'youtu.be' ? u.pathname.slice(1).split('/')[0]
        : /^\/(shorts|live)\//.test(u.pathname) ? u.pathname.split('/')[2]
        : null;
      const v = u.searchParams.get('v');
      const videoId = pathVideo && VIDEO_ID_PATTERN.test(pathVideo) ? pathVideo
        : v && VIDEO_ID_PATTERN.test(v) ? v
        : null;
      if (videoId) return { kind: 'video', id: videoId };
      const list = u.searchParams.get('list');
      return list && PLAYLIST_ID_PATTERN.test(list) ? { kind: 'playlist', id: list } : null;
    } catch (err) {
      if (VIDEO_ID_PATTERN.test(trimmed)) return { kind: 'video', id: trimmed };
      return PLAYLIST_ID_PATTERN.test(trimmed) ? { kind: 'playlist', id: trimmed } : null;
    }
  }

  // One entry per gallery item type. Adding a second one later is just
  // another entry here (icon/title/description plus its own renderForm)
  // -- the shell below (render(), handleSave()) only ever loops over
  // this array and the screens[] it already fetched, it doesn't know or
  // care what "songList" specifically means.
  const OPTIONS = [
    {
      type: 'songList',
      title: 'Song List',
      icon: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" stroke="#1f5fd1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="#1f5fd1" stroke-width="1.8" fill="none"/><circle cx="17" cy="16" r="3" stroke="#1f5fd1" stroke-width="1.8" fill="none"/></svg>',
      description: "Paste a YouTube playlist or video link and it'll be ready to play on its own screen.",
      // Renders this type's own add/edit form into `container`. Calls
      // onSave(sanitizedEntryOrNull) -- null means "remove this entry
      // entirely" (Remove button), otherwise the entry to upsert.
      renderForm(container, existingEntry) {
        container.innerHTML = `
          <label for="songListInput">YouTube playlist or video link</label>
          <input type="text" id="songListInput" placeholder="https://youtube.com/watch?v=... or /playlist?list=..." autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="card-actions">
            <button type="button" class="btn btn-primary" id="songListSaveBtn">${existingEntry ? 'Update' : 'Add'}</button>
            ${existingEntry ? '<button type="button" class="btn btn-text" id="songListRemoveBtn">Remove</button>' : ''}
            <p class="form-status" id="songListFormStatus"></p>
          </div>
        `;
        const input = container.querySelector('#songListInput');
        const status = container.querySelector('#songListFormStatus');
        const saveBtn = container.querySelector('#songListSaveBtn');
        const removeBtn = container.querySelector('#songListRemoveBtn');

        saveBtn.addEventListener('click', async () => {
          const ref = extractYoutubeMusicRefClient(input.value);
          if (!ref) {
            status.textContent = "That doesn't look like a YouTube playlist or video link.";
            status.classList.add('error');
            return;
          }
          status.textContent = '';
          status.classList.remove('error');
          saveBtn.disabled = true;
          saveBtn.textContent = 'Saving…';
          try {
            await handleSave('songList', { type: 'songList', kind: ref.kind, id: ref.id });
          } catch (err) {
            status.textContent = "Couldn't save that right now (" + err.message + ")";
            status.classList.add('error');
            saveBtn.disabled = false;
            saveBtn.textContent = existingEntry ? 'Update' : 'Add';
          }
        });

        if (removeBtn) {
          removeBtn.addEventListener('click', async () => {
            removeBtn.disabled = true;
            saveBtn.disabled = true;
            try {
              await handleSave('songList', null);
            } catch (err) {
              status.textContent = "Couldn't remove that right now (" + err.message + ")";
              status.classList.add('error');
              removeBtn.disabled = false;
              saveBtn.disabled = false;
            }
          });
        }
      }
    },
    {
      type: 'liveVideo',
      title: 'Live Video Feed',
      icon: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2" stroke="#1f5fd1" stroke-width="1.8" fill="none"/><path d="M16 10l6-3.5v11L16 14" stroke="#1f5fd1" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>',
      description: 'Paste a YouTube live stream link (a beach cam, a webcam, anything live) and it\'ll play muted on its own screen -- tap it for sound.',
      renderForm(container, existingEntry) {
        container.innerHTML = `
          <label for="liveVideoInput">YouTube live video link</label>
          <input type="text" id="liveVideoInput" placeholder="https://youtube.com/watch?v=..." autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="card-actions">
            <button type="button" class="btn btn-primary" id="liveVideoSaveBtn">${existingEntry ? 'Update' : 'Add'}</button>
            ${existingEntry ? '<button type="button" class="btn btn-text" id="liveVideoRemoveBtn">Remove</button>' : ''}
            <p class="form-status" id="liveVideoFormStatus"></p>
          </div>
        `;
        const input = container.querySelector('#liveVideoInput');
        const status = container.querySelector('#liveVideoFormStatus');
        const saveBtn = container.querySelector('#liveVideoSaveBtn');
        const removeBtn = container.querySelector('#liveVideoRemoveBtn');

        saveBtn.addEventListener('click', async () => {
          // Reuses the same playlist-or-video parser as Song List, but
          // only a single video makes sense for a live feed -- a
          // playlist link here is rejected with its own clearer message
          // rather than the generic "doesn't look like a link" one.
          const ref = extractYoutubeMusicRefClient(input.value);
          if (ref && ref.kind === 'playlist') {
            status.textContent = 'That looks like a playlist link -- paste a single video link instead.';
            status.classList.add('error');
            return;
          }
          if (!ref) {
            status.textContent = "That doesn't look like a YouTube video link.";
            status.classList.add('error');
            return;
          }
          status.textContent = '';
          status.classList.remove('error');
          saveBtn.disabled = true;
          saveBtn.textContent = 'Saving…';
          try {
            await handleSave('liveVideo', { type: 'liveVideo', id: ref.id });
          } catch (err) {
            status.textContent = "Couldn't save that right now (" + err.message + ")";
            status.classList.add('error');
            saveBtn.disabled = false;
            saveBtn.textContent = existingEntry ? 'Update' : 'Add';
          }
        });

        if (removeBtn) {
          removeBtn.addEventListener('click', async () => {
            removeBtn.disabled = true;
            saveBtn.disabled = true;
            try {
              await handleSave('liveVideo', null);
            } catch (err) {
              status.textContent = "Couldn't remove that right now (" + err.message + ")";
              status.classList.add('error');
              removeBtn.disabled = false;
              saveBtn.disabled = false;
            }
          });
        }
      }
    }
  ];

  let currentScreens = [];

  // Shared by every OPTIONS entry's form -- reads currentScreens, swaps
  // in the new/removed entry for this one type, PUTs the whole array
  // (server-side upsert-by-type already collapses this, see
  // sanitizeKeychainScreens's own comment), and re-renders on success.
  async function handleSave(type, entryOrNull) {
    const withoutThisType = currentScreens.filter(s => s.type !== type);
    const next = entryOrNull ? withoutThisType.concat([entryOrNull]) : withoutThisType;
    currentScreens = await saveScreens(next);
    render();
  }

  function render() {
    cardList.innerHTML = '';
    for (const opt of OPTIONS) {
      const existing = currentScreens.find(s => s.type === opt.type) || null;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div class="card-icon">${opt.icon}</div>
          <div>
            <p class="card-title">${opt.title}</p>
          </div>
          ${existing ? '<span class="card-badge">Added</span>' : ''}
        </div>
        <p class="card-desc">${opt.description}</p>
        <div class="card-form"></div>
      `;
      cardList.appendChild(card);
      opt.renderForm(card.querySelector('.card-form'), existing);
    }
  }

  (async () => {
    try {
      currentScreens = await fetchScreens();
      render();
    } catch (err) {
      pageStatus.textContent = "Couldn't load your screens right now (" + err.message + ") -- try again in a bit.";
      pageStatus.classList.add('error');
    }
  })();
</script>
</body>
</html>
