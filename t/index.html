<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wave Clock Tide</title>
<meta name="theme-color" content="#ffffff">
<style>
  :root { --ink: #0f1b3d; --soft: #4a5675; --wave: #1f5fd1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
    text-align: center;
  }
  h1 { font-size: 30px; font-weight: 900; margin: 80px 0 10px; line-height: 1.2; }
  p { font-size: 18px; color: var(--soft); margin: 0 0 22px; line-height: 1.5; }
  a.btn { display: inline-block; background: var(--wave); color: #fff; border-radius: 14px; padding: 16px 28px; font-size: 18px; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
  <!--
    This is only reached by a bare /t/ or /t visit, with no tag ID --
    nobody should normally land here (every real Wave Clock keychain's
    NFC tag points at its own https://waveclock.net/t/{ID}, which 404s
    to the ID-aware app at /404.html instead -- see that file's own
    comment for why). Kept as a small, friendly landing instead of a
    blank/broken page for the rare stray visit.
  -->
  <h1>Tap your Wave Clock tag</h1>
  <p>This page needs a specific keychain's link to show its tide. If you scanned an NFC tag or QR code and landed here, try the tap again.</p>
  <a class="btn" href="https://waveclock.net">Go to waveclock.net</a>
</body>
</html>
