<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Local Info — Design Your Wave Clock</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #F1E6CF;
    --foam: #F8F2E4;
    --ink: #1F3347;
    --ink-soft: #4C6478;
    --coral: #C97456;
    --coral-dark: #A85C42;
    --navy: #2C4A63;
    --navy-dark: #1B2E3F;
    --line: rgba(31, 51, 71, 0.14);

    --display: 'Bungee', system-ui, sans-serif;
    --heading: 'Fraunces', Georgia, serif;
    --body: 'Work Sans', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--sand);
    font-family: var(--body);
    color: var(--ink);
    padding: 20px 16px 60px;
  }

  .top-bar {
    max-width: 760px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-link {
    font-family: var(--body);
    font-weight: 600;
    font-size: 14px;
    color: var(--navy);
    text-decoration: none;
    padding: 8px 4px;
  }
  .back-link:hover { text-decoration: underline; }

  h1 {
    font-family: var(--heading);
    font-size: 22px;
    margin: 0;
  }

  .intro {
    max-width: 760px;
    margin: 0 auto 24px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.5;
  }

  .option-list {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .option-card {
    background: var(--foam);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }

  .option-title {
    font-family: var(--heading);
    font-weight: 700;
    font-size: 18px;
    margin: 0 0 4px;
  }

  .option-desc {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 14px;
  }

  .preview-frame {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    margin-bottom: 12px;
  }
  .preview-frame canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .preview-status {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .use-this-btn {
    display: inline-block;
    padding: 10px 20px;
    border: 2px solid var(--navy);
    border-radius: 8px;
    background: var(--navy);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
  }
  .use-this-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" id="backLink" href="index.html">&larr; Back</a>
  <h1>Local Info</h1>
</div>
<p class="intro">
  These cards pull live, hyper-regional data — pick one to preview it below,
  then use it on your screen. More will be added here over time as we hear
  what your area could use.
</p>

<div class="option-list" id="optionList"></div>

<script type="module">
  // Standalone page -- deliberately duplicates the flag-drawing code from
  // index.html/functions/lib/beachflag.js rather than sharing a module,
  // same "no shared module" convention used everywhere else in this repo
  // (see dynamic.js's own header comment). If the real card layout
  // changes, this preview must be updated too or it'll mislead customers
  // about what they're picking.
  const params = new URLSearchParams(window.location.search);
  const deviceId = params.get("id");
  const screenParam = parseInt(params.get("screen"), 10);
  const screen = (screenParam === 2 || screenParam === 3) ? screenParam : 1;

  const backLink = document.getElementById("backLink");
  if (deviceId) {
    backLink.href = "index.html?id=" + encodeURIComponent(deviceId) + "&screen=" + screen;
  }

  // Resolves the device's saved location the same way index.html's own
  // resolveTideLocation does -- WITHOUT pulling in the Firebase SDK this
  // page otherwise has no use for (this is read-only), since
  // fetchJsonFromStorage is just a plain fetch() against Storage's public
  // download URL. Needed so the live preview here actually matches what
  // "Use This" hands back to index.html: without a location, the real
  // card (once published) still shows the customer's town name and
  // surf/water/rip-risk stats, and a preview that never fetches those
  // would mislead the customer about what they're picking.
  const STORAGE_BUCKET = "waveclock.firebasestorage.app";
  const FISHING_SPOT_SUFFIX = "-fishing.json";

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error("timed out")), ms))
    ]);
  }

  async function fetchJsonFromStorage(path, timeoutMs) {
    const url = "https://firebasestorage.googleapis.com/v0/b/" + STORAGE_BUCKET + "/o/" + encodeURIComponent(path) + "?alt=media";
    const resp = await withTimeout(fetch(url), timeoutMs);
    if (resp.status === 404) return null;
    if (!resp.ok) throw new Error("fetch failed: " + resp.status);
    return resp.json();
  }

  // Mirrors index.html's resolveTideLocation exactly -- same precedence
  // (custom fishing spot, then the device's own reported location, then
  // whatever the website last submitted) for the same reasons; see that
  // function's own comments in design/index.html.
  async function resolveTideLocation() {
    if (!deviceId) return null;
    try {
      const fishing = await fetchJsonFromStorage("locations/" + deviceId + FISHING_SPOT_SUFFIX, 8000);
      if (fishing && typeof fishing.lat === "number" && typeof fishing.lon === "number" && fishing.stationId) {
        return fishing;
      }
    } catch (err) {
      console.error("Couldn't check for a custom fishing spot (falling back to device location):", err);
    }
    try {
      const deviceStatus = await fetchJsonFromStorage("device-status/" + deviceId + ".json", 8000);
      if (deviceStatus && deviceStatus.location && typeof deviceStatus.location.lat === "number" && typeof deviceStatus.location.lon === "number" && deviceStatus.location.stationId) {
        return deviceStatus.location;
      }
    } catch (err) {
      console.error("Couldn't check device-status (falling back to submitted location):", err);
    }
    return fetchJsonFromStorage("locations/" + deviceId + ".json", 12000);
  }

  const CANVAS_WIDTH = 792;
  const CANVAS_HEIGHT = 272;
  const BANNER_HEIGHT = 48;

  function fitBannerFontSize(ctx, text, maxWidth, family, maxSize, minSize) {
    for (let size = maxSize; size > minSize; size--) {
      ctx.font = size + "px " + family;
      if (ctx.measureText(text).width <= maxWidth) return size;
    }
    ctx.font = minSize + "px " + family;
    return minSize;
  }

  function flagPennantPathClient(ctx, x, y, w, h) {
    const notch = w * 0.24;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - notch, y + h / 2);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.closePath();
  }

  const LOCAL_INFO_FLAG_PATTERNS = { GREEN: "dots", YELLOW: "lines", RED: "solid", "DOUBLE RED": "solid2", PURPLE: "cross" };

  function drawFlagIconClient(ctx, x, y, w, h, pattern) {
    ctx.strokeStyle = "#000";
    ctx.fillStyle = "#000";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y - 6);
    ctx.lineTo(x, y + h + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y - 9, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    flagPennantPathClient(ctx, x, y, w, h);
    ctx.clip();
    ctx.fillStyle = "#fff";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#000";
    ctx.strokeStyle = "#000";
    if (pattern === "solid" || pattern === "solid2") {
      ctx.fillRect(x, y, w, h);
    } else if (pattern === "dots") {
      for (let yy = y + 4; yy < y + h; yy += 8) {
        for (let xx = x + 4; xx < x + w; xx += 8) {
          ctx.beginPath();
          ctx.arc(xx, yy, 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (pattern === "lines") {
      ctx.lineWidth = 2;
      for (let yy = y + 4; yy < y + h; yy += 6) {
        ctx.beginPath();
        ctx.moveTo(x, yy);
        ctx.lineTo(x + w, yy);
        ctx.stroke();
      }
    } else if (pattern === "cross") {
      ctx.lineWidth = 1.6;
      for (let d = -h; d < w + h; d += 7) {
        ctx.beginPath();
        ctx.moveTo(x + d, y);
        ctx.lineTo(x + d - h, y + h);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w - d, y);
        ctx.lineTo(x + w - d + h, y + h);
        ctx.stroke();
      }
    }
    ctx.restore();

    ctx.lineWidth = 3;
    ctx.strokeStyle = "#000";
    flagPennantPathClient(ctx, x, y, w, h);
    ctx.stroke();
  }

  function beachFlagBannerTitleClient(flags) {
    if (!flags.length) return "BEACH FLAGS";
    return flags.map((f) => f.color).join(" + ");
  }

  // Same shrink-to-fit as fitBannerFontSize, but measures WITH a
  // font-weight prefix included -- fitBannerFontSize alone can't do this,
  // and a bold face measures wider than the regular weight it'd otherwise
  // be sized against, so sizing with one weight and drawing with another
  // risks overflowing past maxWidth. Mirrors fitWeightedFontSize in
  // functions/lib/beachflag.js exactly.
  function fitWeightedBannerFontSize(ctx, text, maxWidth, family, weight, maxSize, minSize) {
    for (let size = maxSize; size > minSize; size--) {
      ctx.font = weight + " " + size + "px " + family;
      if (ctx.measureText(text).width <= maxWidth) return size;
    }
    ctx.font = weight + " " + minSize + "px " + family;
    return minSize;
  }

  // Shrinking the font only goes so far -- both fit*FontSize helpers stop
  // at a floor, so a genuinely long string can still be wider than
  // maxWidth even at the smallest allowed size. Call this AFTER settling
  // on a final font (ctx.font already set) to clip with an ellipsis
  // instead of letting it run off the edge of the card. Mirrors
  // truncateToFit in functions/lib/beachflag.js exactly.
  function truncateToFitClient(ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    let truncated = text;
    while (truncated.length > 1 && ctx.measureText(truncated.trim() + "…").width > maxWidth) {
      truncated = truncated.slice(0, -1);
    }
    return truncated.trim() + "…";
  }

  function drawBeachFlagCardClient(ctx, data) {
    const w = CANVAS_WIDTH, h = CANVAS_HEIGHT;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, BANNER_HEIGHT);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    const bannerTitle = beachFlagBannerTitleClient(data.flags);
    const bannerSize = fitBannerFontSize(ctx, bannerTitle, w - 40, "'Bungee', sans-serif", 30, 20);
    ctx.font = bannerSize + "px 'Bungee', sans-serif";
    ctx.fillText(bannerTitle, w / 2, BANNER_HEIGHT / 2 + Math.round(bannerSize * 0.35));

    // Bigger icons than the first cut (88x64, was 70x50) -- this card reads
    // at a glance from across a room, so both the icon and every label on
    // it (except the small "Updated ..." timestamp, which nobody needs to
    // read from a distance) should be as large as the layout can fit.
    const iconY = BANNER_HEIGHT + 36;
    const iconW = 88, iconH = 64;
    const doubleStackGap = 4;
    const iconMaxWidth = 264;
    let iconX = 56;
    let maxIconBottomY = 0;
    const flags = data.flags.length ? data.flags : [{ color: "GREEN", label: "No current advisory" }];
    flags.forEach((f) => {
      const pattern = LOCAL_INFO_FLAG_PATTERNS[f.color] || "dots";
      let bottomY;
      if (f.color === "DOUBLE RED") {
        // Shorter than a single flag's iconH (64) -- two full-height
        // pennants stacked on one pole would leave no room below for the
        // caption + rip risk line within the card's fixed height, so this
        // pair is drawn a little more compact than a lone flag is.
        const stackH = 52;
        drawFlagIconClient(ctx, iconX, iconY, iconW, stackH, pattern);
        drawFlagIconClient(ctx, iconX, iconY + stackH + doubleStackGap, iconW, stackH, pattern);
        bottomY = iconY + stackH * 2 + doubleStackGap;
      } else {
        drawFlagIconClient(ctx, iconX, iconY, iconW, iconH, pattern);
        bottomY = iconY + iconH;
      }
      ctx.textAlign = "center";
      ctx.fillStyle = "#000";
      ctx.font = "600 18px Georgia, serif";
      ctx.fillText(f.color, iconX + iconW / 2, bottomY + 24);
      maxIconBottomY = Math.max(maxIconBottomY, bottomY);
      iconX += 150;
    });

    // Rip current risk sits under the flags themselves, not buried in the
    // stats line with surf height/water temp -- it's a hazard reading, not
    // a nice-to-have stat, so it gets equal billing with the flag icons it
    // describes.
    if (data.ripRisk) {
      const ripText = "RIP RISK: " + data.ripRisk;
      ctx.textAlign = "left";
      ctx.fillStyle = "#000";
      fitWeightedBannerFontSize(ctx, ripText, iconMaxWidth, "Georgia, serif", "700", 24, 18);
      ctx.fillText(ripText, 56, maxIconBottomY + 58);
    }

    const textX = 340;
    const textMaxWidth = w - textX - 32;
    let y = BANNER_HEIGHT + 46;
    ctx.textAlign = "left";
    ctx.fillStyle = "#000";

    // Town name, when the device has a saved location. A device's town
    // nickname is normally short, but shrink-to-fit (and, in the rare
    // case that's still not enough, truncateToFitClient) anyway rather
    // than trust it never runs long -- it's the customer's own free
    // text, unlike every other label on this card.
    if (data.townName) {
      let townText = data.townName.toUpperCase();
      const townSize = fitWeightedBannerFontSize(ctx, townText, textMaxWidth, "Georgia, serif", "600", 28, 20);
      townText = truncateToFitClient(ctx, townText, textMaxWidth);
      ctx.fillStyle = "#444";
      ctx.fillText(townText, textX, y);
      ctx.fillStyle = "#000";
      y += townSize + 22;
    }

    // primaryLabel/secondary labels come from 30a.com's scraped page, not
    // this app's own fixed strings -- shrink-to-fit like townName above,
    // and same truncateToFitClient safety net for the rare label too long
    // to fit even at the smallest allowed size.
    let primaryLabel = flags[0].label.toUpperCase();
    const labelSize = fitBannerFontSize(ctx, primaryLabel, textMaxWidth, "'Bungee', sans-serif", 34, 22);
    ctx.font = labelSize + "px 'Bungee', sans-serif";
    primaryLabel = truncateToFitClient(ctx, primaryLabel, textMaxWidth);
    ctx.fillText(primaryLabel, textX, y);
    y += labelSize + 20;

    // Secondary flag labels and the surf/water stat line both aim for
    // roughly the same size as the primary hazard label above (the "nice
    // size" this card is built around) -- just not drawn with the heavy
    // Bungee display weight, so the primary label still reads as the one
    // headline.
    ctx.font = "30px Georgia, serif";
    for (const f of flags.slice(1)) {
      ctx.fillText(truncateToFitClient(ctx, f.label, textMaxWidth), textX, y);
      y += 36;
    }

    const statParts = [];
    if (data.swellHeightFt != null) statParts.push("Surf " + data.swellHeightFt + " ft");
    if (data.waterTempF != null) statParts.push("Water " + data.waterTempF + "°F");
    if (statParts.length) {
      const statText = statParts.join("   ·   ");
      fitWeightedBannerFontSize(ctx, statText, textMaxWidth, "Georgia, serif", "600", 28, 20);
      ctx.fillText(statText, textX, h - 24);
    }

    if (data.lastRefreshedText) {
      ctx.textAlign = "right";
      ctx.font = "11px Georgia, serif";
      ctx.fillStyle = "#444";
      ctx.fillText("Updated " + data.lastRefreshedText, w - 24, h - 10);
    }
  }

  // Mirrors drawMusicCard/fetchMusicEventsCardData in
  // functions/lib/liveMusic.js exactly -- see that file's own header
  // comment for the customer-provided Beach API this pulls from. If one
  // changes, the other must too.
  // Row geometry mirrors liveMusic.js's MAX_ROWS/ROW_START_Y/ROW_LAST_Y/
  // ROW_STEP/FOOTER_Y exactly -- see that file's own comment for why the
  // last row ends at h-24 (the same baseline Beach Flags' stat line uses
  // right above the "Updated ..." timestamp) and why overflow shares the
  // bottom footer row with the timestamp instead of costing a 7th row.
  const MUSIC_MAX_ROWS = 6;
  const MUSIC_ROW_START_Y = BANNER_HEIGHT + 28;

  function drawMusicCardClient(ctx, data) {
    const page = data.page === 1 ? 1 : 0;
    const w = CANVAS_WIDTH, h = CANVAS_HEIGHT;
    const rowLastY = h - 24;
    const rowStep = Math.round((rowLastY - MUSIC_ROW_START_Y) / (MUSIC_MAX_ROWS - 1));
    const footerY = h - 10;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, BANNER_HEIGHT);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    const bannerTitle = page === 1 ? "MORE LIVE MUSIC TODAY" : "LIVE MUSIC TODAY";
    const bannerSize = fitBannerFontSize(ctx, bannerTitle, w - 40, "'Bungee', sans-serif", 30, 20);
    ctx.font = bannerSize + "px 'Bungee', sans-serif";
    // Nudged up from the plain vertical center (0.35 -> 0.30) -- tucks
    // the banner text toward the top of its bar rather than dead center.
    ctx.fillText(bannerTitle, w / 2, BANNER_HEIGHT / 2 + Math.round(bannerSize * 0.30));

    if (!data.events.length) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#000";
      ctx.font = "26px Georgia, serif";
      const message = page === 1 ? "No more shows scheduled today" : "No live music scheduled today";
      ctx.fillText(message, w / 2, BANNER_HEIGHT + (h - BANNER_HEIGHT) / 2 + 8);
      return;
    }

    const leftX = 40;
    const timeColWidth = 168;
    const detailX = leftX + timeColWidth;
    const detailMaxWidth = w - detailX - 32;

    const shown = data.events.slice(0, MUSIC_MAX_ROWS);
    // page*MUSIC_MAX_ROWS events were already accounted for on earlier
    // pages -- moreCount is what's left beyond THIS page's own shown rows.
    const moreCount = Math.max(0, data.totalToday - (page * MUSIC_MAX_ROWS + shown.length));

    let y = MUSIC_ROW_START_Y;
    shown.forEach((event) => {
      ctx.textAlign = "left";
      ctx.fillStyle = "#000";
      ctx.font = "600 22px Georgia, serif";
      if (event.range) ctx.fillText(event.range, leftX, y);

      const detailParts = [];
      if (event.venue) detailParts.push(event.venue.toUpperCase());
      if (event.act) detailParts.push(event.act);
      const detailText = detailParts.join(" — ");
      if (detailText) {
        ctx.font = "22px Georgia, serif";
        ctx.fillText(truncateToFitClient(ctx, detailText, detailMaxWidth), detailX, y);
      }
      y += rowStep;
    });

    if (moreCount > 0) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#444";
      ctx.font = "14px Georgia, serif";
      ctx.fillText("+ " + moreCount + " more today", leftX, footerY);
    }

    if (data.generatedAtLabel) {
      ctx.textAlign = "right";
      ctx.font = "11px Georgia, serif";
      ctx.fillStyle = "#444";
      const label = "Updated " + data.generatedAtLabel + (data.stale ? " (may be delayed)" : "");
      ctx.fillText(label, w - 24, footerY);
    }
  }

  const LIVE_MUSIC_PROXY_BASE = "https://us-central1-waveclock.cloudfunctions.net/liveMusicProxy";

  async function fetchMusicEventsCardDataClient(page) {
    const qs = page === 1 ? "?page=1" : "";
    const resp = await fetch(LIVE_MUSIC_PROXY_BASE + qs);
    const data = await resp.json();
    if (!resp.ok) throw new Error((data && data.error) || ("Live music fetch failed: " + resp.status));
    return data;
  }

  // ================= OCNJ Events (Local Info: ocnjEvents) =================
  // Mirrors drawOcnjEventsCard/fetchOcnjEventsCardData in
  // functions/lib/ocnjCard.js exactly -- see design/index.html's own copy
  // of this same pair for why (reads the daily pipeline's published
  // data/ocnj-events.json through ocnjEventsProxy rather than re-running
  // it). If one changes, all three must.
  const OCNJ_MAX_ROWS = 6;
  const OCNJ_ROW_START_Y = BANNER_HEIGHT + 28;

  // Mirrors formatEventDateLabel in functions/lib/ocnjCard.js exactly --
  // see that file's own comment for why this is a plain string split
  // rather than a Date/Intl round-trip.
  function formatEventDateLabelClient(dateStr) {
    if (!dateStr) return null;
    const parts = dateStr.split("-");
    if (parts.length !== 3) return null;
    const month = parseInt(parts[1], 10);
    const day = parseInt(parts[2], 10);
    if (!month || !day) return null;
    return month + "/" + day;
  }

  function drawOcnjEventsCardClient(ctx, data) {
    const w = CANVAS_WIDTH, h = CANVAS_HEIGHT;
    const rowLastY = h - 24;
    const rowStep = Math.round((rowLastY - OCNJ_ROW_START_Y) / (OCNJ_MAX_ROWS - 1));
    const footerY = h - 10;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, BANNER_HEIGHT);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    const bannerTitle = "EVENTS IN OCEAN CITY, NJ";
    const bannerSize = fitBannerFontSize(ctx, bannerTitle, w - 40, "'Bungee', sans-serif", 30, 20);
    ctx.font = bannerSize + "px 'Bungee', sans-serif";
    ctx.fillText(bannerTitle, w / 2, BANNER_HEIGHT / 2 + Math.round(bannerSize * 0.30));

    if (!data.events.length) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#000";
      ctx.font = "26px Georgia, serif";
      ctx.fillText("No upcoming events found", w / 2, BANNER_HEIGHT + (h - BANNER_HEIGHT) / 2 + 8);
    } else {
      const leftX = 40;
      // Wide enough for "12/25  11:00 AM" (the longest realistic date+time
      // pairing) at this row's font/size without needing its own truncation.
      const timeColWidth = 200;
      const detailX = leftX + timeColWidth;
      const detailMaxWidth = w - detailX - 32;

      let y = OCNJ_ROW_START_Y;
      data.events.forEach((event) => {
        ctx.textAlign = "left";
        ctx.fillStyle = "#000";
        ctx.font = "600 22px Georgia, serif";
        // Date always shows (this card now spans several upcoming days, not
        // just today) -- time joins it when known, e.g. "9/16  6:00 PM".
        const dateTimeParts = [formatEventDateLabelClient(event.date), event.time].filter(Boolean);
        if (dateTimeParts.length) ctx.fillText(dateTimeParts.join("  "), leftX, y);

        const detailParts = [];
        if (event.title) detailParts.push(event.title);
        if (event.location) detailParts.push(event.location);
        const detailText = detailParts.join(" — ");
        if (detailText) {
          ctx.font = "22px Georgia, serif";
          ctx.fillText(truncateToFitClient(ctx, detailText, detailMaxWidth), detailX, y);
        }
        y += rowStep;
      });
    }

    if (data.generatedAtLabel) {
      ctx.textAlign = "right";
      ctx.font = "11px Georgia, serif";
      ctx.fillStyle = "#444";
      const label = "Updated " + data.generatedAtLabel + (data.stale ? " (may be delayed)" : "");
      ctx.fillText(label, w - 24, footerY);
    }
  }

  const OCNJ_EVENTS_PROXY_BASE = "https://us-central1-waveclock.cloudfunctions.net/ocnjEventsProxy";

  async function fetchOcnjEventsCardDataClient() {
    const resp = await fetch(OCNJ_EVENTS_PROXY_BASE);
    const data = await resp.json();
    if (!resp.ok) throw new Error((data && data.error) || ("OCNJ events fetch failed: " + resp.status));
    return data;
  }

  function drawLoadingCard(ctx, message) {
    const w = CANVAS_WIDTH, h = CANVAS_HEIGHT;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, BANNER_HEIGHT);
    ctx.fillStyle = "#444";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "16px Georgia, serif";
    ctx.fillText(message, w / 2, h / 2 + BANNER_HEIGHT / 2);
  }

  const BEACH_FLAG_PROXY_BASE = "https://us-central1-waveclock.cloudfunctions.net/beachFlagProxy";

  async function fetchBeachFlagCardDataClient() {
    // Resolve the device's saved location first, same as index.html's
    // loadLocalInfoLayer does, so this preview shows the same town name
    // and surf/water/rip-risk stats "Use This" ends up publishing --
    // without a location (no device id in the link, or nothing saved
    // yet), this still degrades gracefully to the location-independent
    // version, same as beachFlagProxy already does for Beach Buddy/Tide.
    const location = await resolveTideLocation().catch(() => null);
    const hasLocation = location && typeof location.lat === "number" && typeof location.lon === "number" && location.stationId;
    const query = new URLSearchParams();
    if (hasLocation) {
      query.set("lat", String(location.lat));
      query.set("lon", String(location.lon));
      query.set("stationId", String(location.stationId));
      if (location.name) query.set("townName", location.name);
    }
    const qs = query.toString();
    const resp = await fetch(BEACH_FLAG_PROXY_BASE + (qs ? "?" + qs : ""));
    const data = await resp.json();
    if (!resp.ok) throw new Error((data && data.error) || ("Beach flag fetch failed: " + resp.status));
    return data;
  }

  // ================= Hurricane Tracker (gallery preview) =================
  // Mirrors functions/lib/hurricaneTracker.js's drawHurricaneTrackerCard
  // exactly -- see that file's own header comment for the NHC data source
  // and the coastline-approximation caveat. Same duplicated-per-file
  // convention as design/index.html's own copy (see that file's comment
  // on this card for why duplicated, not shared).
  const HURRICANE_TRACKER_PROXY_BASE = "https://us-central1-waveclock.cloudfunctions.net/hurricaneTrackerProxy";
  const HURRICANE_PANEL_GAP = 8;
  const HURRICANE_PANEL_RADIUS = 18;
  const HURRICANE_BANNER_HEIGHT = 40;

  // No device-specific location at all in the common case (this gallery
  // page is reached without a device id just as often as with one) --
  // falls back to a real 30A, FL coordinate so the preview still shows
  // a real nearby-or-not storm check instead of an empty, useless state.
  const HURRICANE_FALLBACK_LOCATION = { lat: 30.28, lon: -86.0, name: "30A, FL" };

  async function fetchHurricaneTrackerCardDataClient() {
    const location = await resolveTideLocation().catch(() => null);
    const hasLocation = location && typeof location.lat === "number" && typeof location.lon === "number";
    const useLocation = hasLocation ? location : HURRICANE_FALLBACK_LOCATION;
    const url = HURRICANE_TRACKER_PROXY_BASE + "?lat=" + encodeURIComponent(useLocation.lat) + "&lon=" + encodeURIComponent(useLocation.lon)
      + (useLocation.name ? "&townName=" + encodeURIComponent(useLocation.name) : "");
    const resp = await fetch(url);
    const raw = await resp.json();
    if (!resp.ok) throw new Error((raw && raw.error) || ("Hurricane tracker fetch failed: " + resp.status));
    return Object.assign({ townLat: useLocation.lat, townLon: useLocation.lon }, raw);
  }

  function hurricaneDrawStar(ctx, cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45;
      const ang = -Math.PI / 2 + (i * Math.PI) / 5;
      const x = cx + rad * Math.cos(ang), y = cy + rad * Math.sin(ang);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function hurricanePanel(ctx, x, y, w, h) {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, HURRICANE_PANEL_RADIUS);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#000";
    ctx.stroke();
  }

  function hurricaneEvenlySpacedRows(ctx, panelBox, rows) {
    const cx = panelBox.x + panelBox.w / 2;
    ctx.textAlign = "center";
    const metrics = rows.map((row) => {
      ctx.font = row.font;
      const m = ctx.measureText(row.text);
      return { ascent: m.actualBoundingBoxAscent, h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent };
    });
    const totalTextH = metrics.reduce((s, m) => s + m.h, 0);
    const gap = Math.max(4, (panelBox.h - totalTextH) / (rows.length + 1));
    let y = panelBox.y + gap;
    rows.forEach((row, i) => {
      ctx.font = row.font;
      ctx.fillStyle = row.color || "#000";
      ctx.fillText(row.text, cx, y + metrics[i].ascent);
      y += metrics[i].h + gap;
    });
  }

  // Mirrors the server's drawHeroStats -- see that function's own
  // comment for why. Miles-away and current wind speed as two equally
  // big numbers side by side, each with its own small label underneath.
  // topText is a single status line (e.g. "NOW \u00b7 CAT 1") kept on one
  // row so it adds only one line of height above the numbers. Mirrors the
  // server's drawTwoBigStats.
  function hurricaneDrawTwoBigStats(ctx, panelBox, topText, leftValue, leftLabel, rightValue, rightLabel) {
    const topFont = "bold 20px Georgia, serif";
    const bigFont = "52px 'Bungee', sans-serif";
    const labelFont = "bold 18px Georgia, serif";

    ctx.font = topFont;
    const topM = ctx.measureText(topText);
    const topTotalH = topM.actualBoundingBoxAscent + topM.actualBoundingBoxDescent;

    ctx.font = bigFont;
    const leftBigM = ctx.measureText(leftValue);
    const rightBigM = ctx.measureText(rightValue);
    const bigAscent = Math.max(leftBigM.actualBoundingBoxAscent, rightBigM.actualBoundingBoxAscent);
    const bigH = bigAscent + Math.max(leftBigM.actualBoundingBoxDescent, rightBigM.actualBoundingBoxDescent);

    ctx.font = labelFont;
    const labelM = ctx.measureText(leftLabel.length >= rightLabel.length ? leftLabel : rightLabel);
    const labelH = labelM.actualBoundingBoxAscent + labelM.actualBoundingBoxDescent;

    const totalTextH = topTotalH + bigH + labelH;
    const gap = Math.max(4, (panelBox.h - totalTextH) / 4);
    const leftX = panelBox.x + panelBox.w * 0.27, rightX = panelBox.x + panelBox.w * 0.73;

    ctx.textAlign = "center";
    ctx.fillStyle = "#000";

    let y = panelBox.y + gap;
    ctx.font = topFont;
    ctx.fillText(topText, panelBox.x + panelBox.w / 2, y + topM.actualBoundingBoxAscent);
    y += topTotalH + gap;

    ctx.font = bigFont;
    ctx.fillText(leftValue, leftX, y + bigAscent);
    ctx.fillText(rightValue, rightX, y + bigAscent);
    y += bigH + gap;

    ctx.font = labelFont;
    ctx.fillText(leftLabel, leftX, y + labelM.actualBoundingBoxAscent);
    ctx.fillText(rightLabel, rightX, y + labelM.actualBoundingBoxAscent);
  }

  // Mirrors the server's drawClosestApproachStats -- see that function's
  // own comment for why this panel has its own layout (middle block
  // between the numbers, no top status line) instead of reusing
  // hurricaneDrawTwoBigStats.
  function hurricaneDrawClosestApproachStats(ctx, panelBox, leftValue, leftLabel, rightValue, rightLabel, midTop, midBottom) {
    const bigFont = "52px 'Bungee', sans-serif";
    const labelFont = "bold 18px Georgia, serif";

    ctx.font = bigFont;
    const leftBigM = ctx.measureText(leftValue);
    const rightBigM = ctx.measureText(rightValue);
    const bigAscent = Math.max(leftBigM.actualBoundingBoxAscent, rightBigM.actualBoundingBoxAscent);
    const bigH = bigAscent + Math.max(leftBigM.actualBoundingBoxDescent, rightBigM.actualBoundingBoxDescent);

    ctx.font = labelFont;
    const labelM = ctx.measureText(leftLabel.length >= rightLabel.length ? leftLabel : rightLabel);
    const labelH = labelM.actualBoundingBoxAscent + labelM.actualBoundingBoxDescent;

    const totalTextH = bigH + labelH;
    const gap = Math.max(4, (panelBox.h - totalTextH) / 3);
    const leftX = panelBox.x + panelBox.w * 0.2, rightX = panelBox.x + panelBox.w * 0.8;

    ctx.textAlign = "center";
    ctx.fillStyle = "#000";

    let y = panelBox.y + gap;
    ctx.font = bigFont;
    ctx.fillText(leftValue, leftX, y + bigAscent);
    ctx.fillText(rightValue, rightX, y + bigAscent);
    y += bigH + gap;

    ctx.font = labelFont;
    ctx.fillText(leftLabel, leftX, y + labelM.actualBoundingBoxAscent);
    ctx.fillText(rightLabel, rightX, y + labelM.actualBoundingBoxAscent);

    // Long classifications ("TROP. STORM") can easily be wider than
    // the gap actually left between the two number columns at a fixed
    // size -- shrinks both lines together (one size for both) to
    // whatever fits the real available width, down to a legible floor,
    // rather than overlapping the numbers. Mirrors the server's own fix.
    const midX = panelBox.x + panelBox.w * 0.5;
    const midMaxWidth = Math.max(40, (rightX - rightBigM.width / 2) - (leftX + leftBigM.width / 2) - 16);
    function fitMidSize(text) {
      for (let size = 22; size > 11; size--) {
        ctx.font = "bold " + size + "px Georgia, serif";
        if (ctx.measureText(text).width <= midMaxWidth) return size;
      }
      return 11;
    }
    const midSize = Math.min(fitMidSize(midTop), fitMidSize(midBottom));
    const midFont = "bold " + midSize + "px Georgia, serif";

    ctx.font = midFont;
    const midTopM = ctx.measureText(midTop);
    const midTopH = midTopM.actualBoundingBoxAscent + midTopM.actualBoundingBoxDescent;
    const midBottomM = ctx.measureText(midBottom);
    const midBottomH = midBottomM.actualBoundingBoxAscent + midBottomM.actualBoundingBoxDescent;
    const midGap = 6;
    let midY = panelBox.y + (panelBox.h - (midTopH + midGap + midBottomH)) / 2;
    ctx.fillText(midTop, midX, midY + midTopM.actualBoundingBoxAscent);
    midY += midTopH + midGap;
    ctx.fillText(midBottom, midX, midY + midBottomM.actualBoundingBoxAscent);
  }

  function hurricaneDrawBanner(ctx, w, text) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, HURRICANE_BANNER_HEIGHT);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    const size = fitBannerFontSize(ctx, text, w - 30, "'Bungee', sans-serif", 30, 16);
    ctx.font = size + "px 'Bungee', sans-serif";
    const m = ctx.measureText(text);
    const textH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    const baseline = (HURRICANE_BANNER_HEIGHT - textH) / 2 + m.actualBoundingBoxAscent;
    ctx.fillText(text, w / 2, baseline);
  }

  // Strictly increasing in x on purpose -- see the same comment on the
  // server's COASTLINE_TEMPLATES (functions/lib/hurricaneTracker.js) for
  // why: hurricaneDrawMapPanel fills down to the panel's bottom edge as a
  // solid landmass, and a non-monotonic curve makes that fill self-
  // intersect into a broken-looking shape.
  const HURRICANE_COASTLINE_TEMPLATES = {
    midAtlantic: {
      coast: [[2, -10], [18, 6], [32, 16], [42, 11], [56, 30], [70, 50], [85, 66], [100, 94]],
      town: [32, 16]
    },
    gulf: {
      coast: [[0, 34], [16, 26], [30, 19], [44, 23], [58, 11], [72, 20], [86, 32], [100, 28]],
      delta: [58, 11],
      town: [30, 19]
    }
  };

  function hurricanePickCoastlineTemplate(lat, lon) {
    if (typeof lon === "number" && lon <= -85 && lat < 31) return HURRICANE_COASTLINE_TEMPLATES.gulf;
    return HURRICANE_COASTLINE_TEMPLATES.midAtlantic;
  }

  // Filled landmass (land = below/right of the curve, closed to the
  // panel's own bottom+right edges), not just a stroked outline -- reads
  // as land-vs-water at a glance. Mirrors the server's drawLandmass.
  function hurricaneDrawLandmass(ctx, mapPanel, coast) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(mapPanel.x, mapPanel.y, mapPanel.w, mapPanel.h);
    ctx.clip();

    ctx.fillStyle = "#dcdcdc";
    ctx.beginPath();
    ctx.moveTo(coast[0].x, coast[0].y);
    for (let i = 1; i < coast.length - 1; i++) {
      const cur = coast[i], next = coast[i + 1];
      ctx.quadraticCurveTo(cur.x, cur.y, (cur.x + next.x) / 2, (cur.y + next.y) / 2);
    }
    ctx.lineTo(coast[coast.length - 1].x, coast[coast.length - 1].y);
    ctx.lineTo(mapPanel.x + mapPanel.w, mapPanel.y + mapPanel.h);
    ctx.lineTo(mapPanel.x, mapPanel.y + mapPanel.h);
    ctx.closePath();
    ctx.fill("evenodd");

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#000";
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(coast[0].x, coast[0].y);
    for (let i = 1; i < coast.length - 1; i++) {
      const cur = coast[i], next = coast[i + 1];
      ctx.quadraticCurveTo(cur.x, cur.y, (cur.x + next.x) / 2, (cur.y + next.y) / 2);
    }
    ctx.lineTo(coast[coast.length - 1].x, coast[coast.length - 1].y);
    ctx.stroke();
    ctx.restore();
  }

  // The map panel only has room for ~4 plotted points, but NHC's real
  // forecast advisories often carry more than that -- picking the first
  // 4 chronologically can leave off the closest-approach point entirely
  // if it falls later in the track. This always INCLUDES the closest-
  // approach point, and reserves one slot for a point AFTER it when the
  // real track has one, so the path visibly turns away rather than
  // always ending mid-approach. Mirrors the server's
  // selectMapTrackPoints -- see that function's own comment for why.
  function hurricaneSelectMapTrackPoints(track, closestApproachIndex) {
    if (!track || track.length === 0) return [];
    const hasClosest = typeof closestApproachIndex === "number" && closestApproachIndex >= 0 && closestApproachIndex < track.length;
    const lastIdx = hasClosest ? closestApproachIndex : track.length - 1;
    const hasTrailingPoint = hasClosest && closestApproachIndex + 1 < track.length;
    const trailingIdx = hasTrailingPoint ? closestApproachIndex + 1 : null;

    const budget = hasTrailingPoint ? 3 : 4;
    const span = lastIdx + 1;
    const leadIndices = span <= budget
      ? Array.from({ length: span }, (_, i) => i)
      : [...new Set(Array.from({ length: budget }, (_, i) => Math.round((i * lastIdx) / (budget - 1))))];

    const indices = trailingIdx !== null ? [...leadIndices, trailingIdx] : leadIndices;
    return indices.map((i) => ({ point: track[i], isClosest: hasClosest && i === closestApproachIndex }));
  }

  // ================= Real track projection =================
  // Mirrors the server's own "Real track projection" block in
  // functions/lib/hurricaneTracker.js -- see that comment for the full
  // rationale (why the old fixed-offset layout was misleading, and the
  // honest limits of plotting real lat/lon onto a hand-approximated
  // coastline).
  const HURRICANE_MILES_PER_DEG_LAT = 69;
  const HURRICANE_TRACK_MAX_PX_PER_MILE = 0.6;

  function hurricaneMilesPerDegLon(lat) {
    return HURRICANE_MILES_PER_DEG_LAT * Math.cos((lat * Math.PI) / 180);
  }

  function hurricaneComputeTrackScale(anchorPx, anchorLat, anchorLon, points, bounds) {
    const MARGIN = 20;
    const rightRoom = bounds.x + bounds.w - MARGIN - anchorPx.x;
    const leftRoom = anchorPx.x - bounds.x - MARGIN;
    const belowRoom = bounds.y + bounds.h - MARGIN - anchorPx.y;
    const aboveRoom = anchorPx.y - bounds.y - MARGIN;
    const milesPerLon = hurricaneMilesPerDegLon(anchorLat);

    let scale = HURRICANE_TRACK_MAX_PX_PER_MILE;
    points.forEach((p) => {
      const dxMiles = (p.lon - anchorLon) * milesPerLon;
      const dyMilesNorth = (p.lat - anchorLat) * HURRICANE_MILES_PER_DEG_LAT;
      if (dxMiles > 0 && rightRoom > 0) scale = Math.min(scale, rightRoom / dxMiles);
      if (dxMiles < 0 && leftRoom > 0) scale = Math.min(scale, leftRoom / -dxMiles);
      if (dyMilesNorth > 0 && aboveRoom > 0) scale = Math.min(scale, aboveRoom / dyMilesNorth);
      if (dyMilesNorth < 0 && belowRoom > 0) scale = Math.min(scale, belowRoom / -dyMilesNorth);
    });
    return Math.max(scale, 0.02);
  }

  function hurricaneProjectTrackPoint(anchorPx, anchorLat, anchorLon, lat, lon, scale) {
    const dxMiles = (lon - anchorLon) * hurricaneMilesPerDegLon(anchorLat);
    const dyMilesNorth = (lat - anchorLat) * HURRICANE_MILES_PER_DEG_LAT;
    return { x: anchorPx.x + dxMiles * scale, y: anchorPx.y - dyMilesNorth * scale };
  }

  function hurricaneEnforceMinRadiusFromAnchor(proj, anchorPx, minRadius) {
    const dx = proj.x - anchorPx.x, dy = proj.y - anchorPx.y;
    const dist = Math.hypot(dx, dy);
    if (dist >= minRadius || dist === 0) return proj;
    const k = minRadius / dist;
    return { x: anchorPx.x + dx * k, y: anchorPx.y + dy * k };
  }

  function hurricaneRectOverlapArea(a, b) {
    const w = Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1));
    const h = Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
    return w * h;
  }

  function hurricaneLayoutTrackLabels(ctx, positions, mapPanel, extraObstacles) {
    const DOT_R = 13, DOT_PAD = 4, GAP = 7, LABEL_H = 15;
    ctx.font = "bold 13px Georgia, serif";

    const dotBoxes = positions.map((p) => ({
      x1: p.x - DOT_R - DOT_PAD, x2: p.x + DOT_R + DOT_PAD,
      y1: p.y - DOT_R - DOT_PAD, y2: p.y + DOT_R + DOT_PAD
    })).concat(extraObstacles || []);

    function clampBox(box, labelX, labelY) {
      let dx = 0, dy = 0;
      if (box.x1 + dx < mapPanel.x + 4) dx = mapPanel.x + 4 - box.x1;
      if (box.x2 + dx > mapPanel.x + mapPanel.w - 4) dx = mapPanel.x + mapPanel.w - 4 - box.x2;
      if (box.y1 + dy < mapPanel.y + 4) dy = mapPanel.y + 4 - box.y1;
      if (box.y2 + dy > mapPanel.y + mapPanel.h - 4) dy = mapPanel.y + mapPanel.h - 4 - box.y2;
      return {
        box: { x1: box.x1 + dx, x2: box.x2 + dx, y1: box.y1 + dy, y2: box.y2 + dy },
        labelX: labelX + dx, labelY: labelY + dy
      };
    }

    const placedBoxes = [];
    return positions.map((p, i) => {
      const text = p.label.day + " " + p.label.time;
      const halfW = ctx.measureText(text).width / 2 + 3;

      const raw = [
        { align: "center", labelX: p.x, labelY: p.y - 20, box: { x1: p.x - halfW, x2: p.x + halfW, y1: p.y - 20 - LABEL_H, y2: p.y - 20 + 4 } },
        { align: "center", labelX: p.x, labelY: p.y + 30, box: { x1: p.x - halfW, x2: p.x + halfW, y1: p.y + 30 - LABEL_H, y2: p.y + 30 + 4 } },
        { align: "left", labelX: p.x + DOT_R + GAP, labelY: p.y + 4, box: { x1: p.x + DOT_R + GAP, x2: p.x + DOT_R + GAP + halfW * 2, y1: p.y - 9, y2: p.y + 9 } },
        { align: "right", labelX: p.x - DOT_R - GAP, labelY: p.y + 4, box: { x1: p.x - DOT_R - GAP - halfW * 2, x2: p.x - DOT_R - GAP, y1: p.y - 9, y2: p.y + 9 } }
      ];

      let best = null, bestOverlap = Infinity;
      raw.forEach((candidate, ci) => {
        const clamped = clampBox(candidate.box, candidate.labelX, candidate.labelY);
        let overlap = 0;
        dotBoxes.forEach((db, j) => { if (j !== i) overlap += hurricaneRectOverlapArea(clamped.box, db); });
        placedBoxes.forEach((pb) => { overlap += hurricaneRectOverlapArea(clamped.box, pb); });
        const score = overlap + ci * 0.01;
        if (score < bestOverlap) {
          bestOverlap = score;
          best = { align: candidate.align, labelX: clamped.labelX, labelY: clamped.labelY, box: clamped.box };
        }
      });

      placedBoxes.push(best.box);
      return best;
    });
  }

  function hurricaneDrawMapPanel(ctx, mapPanel, data) {
    const template = hurricanePickCoastlineTemplate(data.townLat, data.townLon);
    const mox = mapPanel.x + 14, moy = mapPanel.y + 16;
    const msx = (mapPanel.w - 70) / 100, msy = (mapPanel.h - 32) / 80;
    const MP = (x, y) => ({ x: mox + x * msx, y: moy + y * msy });

    const coast = template.coast.map(([x, y]) => MP(x, y));
    hurricaneDrawLandmass(ctx, mapPanel, coast);

    const town = MP(template.town[0], template.town[1]);
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(town.x, town.y + 13, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(town.x, town.y + 13, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#000";
    hurricaneDrawStar(ctx, town.x, town.y + 13, 7.5);

    const points = hurricaneSelectMapTrackPoints(data.track, data.closestApproachIndex);
    if (points.length === 0) return;

    // Real lat/lon projection, anchored at the town marker's own pixel
    // position -- see this file's "Real track projection" comment above.
    const townAnchor = { x: town.x, y: town.y + 13 };
    const scale = hurricaneComputeTrackScale(townAnchor, data.townLat, data.townLon, points.map((e) => e.point), mapPanel);
    const positions = points.map((entry) => {
      const rawProj = hurricaneProjectTrackPoint(townAnchor, data.townLat, data.townLon, entry.point.lat, entry.point.lon, scale);
      const proj = hurricaneEnforceMinRadiusFromAnchor(rawProj, townAnchor, 26);
      return { x: proj.x, y: proj.y, label: entry.point.label, isClosest: entry.isClosest };
    });

    ctx.save();
    ctx.setLineDash([4.5, 4]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    positions.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.restore();

    const townBox = { x1: townAnchor.x - 15, x2: townAnchor.x + 15, y1: townAnchor.y - 15, y2: townAnchor.y + 15 };
    const labelLayout = hurricaneLayoutTrackLabels(ctx, positions, mapPanel, [townBox]);

    positions.forEach((p, i) => {
      ctx.fillStyle = p.isClosest ? "#000" : "#fff";
      ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, Math.PI * 2); ctx.stroke();

      const layout = labelLayout[i];
      ctx.fillStyle = "#000";
      ctx.font = "bold 13px Georgia, serif";
      ctx.textAlign = layout.align;
      ctx.fillText(p.label.day + " " + p.label.time, layout.labelX, layout.labelY);
    });
  }

  // Mirrors the server's stormTypeWord -- see that function's own
  // comment for why this derives the word from classificationNow's
  // already-computed label instead of a second NHC field.
  function hurricaneStormTypeWord(classificationNow) {
    if (!classificationNow) return "";
    if (classificationNow.indexOf("CAT") === 0) return "HURRICANE";
    if (classificationNow === "TROP. STORM") return "TROPICAL STORM";
    if (classificationNow === "TD") return "TROPICAL DEPRESSION";
    return "";
  }

  function drawHurricaneTrackerCardClient(ctx, data) {
    const w = CANVAS_WIDTH, h = CANVAS_HEIGHT;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);

    if (data.noActiveStorm) {
      hurricaneDrawBanner(ctx, w, "HURRICANE TRACKER" + (data.townName ? " — " + data.townName.toUpperCase() : ""));
      const body = { x: HURRICANE_PANEL_GAP, y: HURRICANE_BANNER_HEIGHT + HURRICANE_PANEL_GAP, w: w - HURRICANE_PANEL_GAP * 2, h: h - HURRICANE_BANNER_HEIGHT - HURRICANE_PANEL_GAP * 2 };
      hurricanePanel(ctx, body.x, body.y, body.w, body.h);
      hurricaneEvenlySpacedRows(ctx, body, [
        { text: "NO ACTIVE STORMS NEARBY", font: "44px 'Bungee', sans-serif" },
        { text: "Checked again automatically every hour", font: "bold 18px Georgia, serif", color: "#555" }
      ]);
      return;
    }

    const typeWord = hurricaneStormTypeWord(data.classificationNow);
    const bannerText = (typeWord ? typeWord + " " : "") + data.stormName.toUpperCase() + (data.townName ? " — " + data.townName.toUpperCase() : "");
    hurricaneDrawBanner(ctx, w, bannerText);

    const bodyTop = HURRICANE_BANNER_HEIGHT + HURRICANE_PANEL_GAP, bodyBottom = h - HURRICANE_PANEL_GAP;
    const bodyLeft = HURRICANE_PANEL_GAP, bodyRight = w - HURRICANE_PANEL_GAP;
    const mapW = 270;
    const leftW = bodyRight - HURRICANE_PANEL_GAP - mapW - bodyLeft;
    const halfH = (bodyBottom - bodyTop - HURRICANE_PANEL_GAP) / 2;

    const heroPanel = { x: bodyLeft, y: bodyTop, w: leftW, h: halfH };
    const closestPanel = { x: bodyLeft, y: bodyTop + halfH + HURRICANE_PANEL_GAP, w: leftW, h: halfH };
    const mapPanel = { x: bodyRight - mapW, y: bodyTop, w: mapW, h: bodyBottom - bodyTop };

    hurricanePanel(ctx, heroPanel.x, heroPanel.y, heroPanel.w, heroPanel.h);
    hurricanePanel(ctx, closestPanel.x, closestPanel.y, closestPanel.w, closestPanel.h);
    hurricanePanel(ctx, mapPanel.x, mapPanel.y, mapPanel.w, mapPanel.h);

    const hasWind = data.windMphNow != null;
    hurricaneDrawTwoBigStats(
      ctx, heroPanel, "NOW \u00b7 " + data.classificationNow,
      String(data.miles), "MI " + data.direction,
      hasWind ? String(data.windMphNow) : "N/A", "MPH"
    );

    if (data.closestApproach) {
      const ca = data.closestApproach;
      const caHasWind = ca.windMph != null;
      hurricaneDrawClosestApproachStats(
        ctx, closestPanel,
        String(ca.miles), "MILES",
        caHasWind ? String(ca.windMph) : "N/A", "MPH",
        ca.label.day + " " + ca.label.time, ca.classification
      );
    } else {
      hurricaneEvenlySpacedRows(ctx, closestPanel, [
        { text: "FORECAST TRACK", font: "bold 19px Georgia, serif" },
        { text: "NOT AVAILABLE RIGHT NOW", font: "bold 17px Georgia, serif", color: "#555" }
      ]);
    }

    hurricaneDrawMapPanel(ctx, mapPanel, data);
  }

  // Each entry is one Local Info option. subType must match what
  // design/index.html and functions/lib/dynamic.js expect on the layer
  // (meta.subType) -- adding "Live Music" here later is just another
  // entry with its own draw()/load() pair, no other page changes needed.
  const OPTIONS = [
    {
      subType: "beachFlag",
      title: "Beach Flags Florida - 30A",
      description: "Today's beach hazard flag color(s) for the 30A corridor, straight from the daily posted advisory, plus your town name, surf height, water temperature, and a rip current risk estimate when your clock has a saved location. Updates automatically every few hours.",
      load: fetchBeachFlagCardDataClient,
      draw: drawBeachFlagCardClient
    },
    {
      subType: "liveMusic",
      title: "Live Music Florida - 30A",
      description: "Who's playing tonight at the coastal bars and restaurants along 30A -- show time, venue, and act for today's live music, straight from a real-time events feed covering the whole corridor. No location needed. Updates automatically every hour.",
      load: fetchMusicEventsCardDataClient,
      draw: drawMusicCardClient
    },
    {
      subType: "liveMusicMore",
      title: "More Live Music Florida - 30A",
      description: "The next set of live music happening today at the coastal bars along 30A, picking up where the main Live Music screen leaves off -- put both on your board to see more of today's lineup at once. No location needed. Updates automatically every hour.",
      load: () => fetchMusicEventsCardDataClient(1),
      draw: drawMusicCardClient
    },
    {
      subType: "ocnjEvents",
      title: "OCNJ Events",
      description: "Today's curated events in Ocean City, NJ -- farmers markets, fireworks, concerts, and more -- merged from the town's own calendar and the Chamber of Commerce's events feed. No location needed. Updates automatically once a day.",
      load: fetchOcnjEventsCardDataClient,
      draw: drawOcnjEventsCardClient
    },
    {
      subType: "hurricaneTracker",
      title: "Hurricane Tracker",
      description: "Tracks the nearest active storm from the National Hurricane Center relative to your saved location -- distance, direction, current strength, and how close it's forecast to get at its nearest approach, with a map showing the coastline and real forecast track points. Shows \"no active storms nearby\" the rest of the time. Uses your device's saved location if set, otherwise previews for 30A, FL. Updates automatically every hour.",
      load: fetchHurricaneTrackerCardDataClient,
      draw: drawHurricaneTrackerCardClient
    }
  ];

  const optionList = document.getElementById("optionList");

  OPTIONS.forEach((opt) => {
    const card = document.createElement("div");
    card.className = "option-card";

    const title = document.createElement("h2");
    title.className = "option-title";
    title.textContent = opt.title;
    card.appendChild(title);

    const desc = document.createElement("p");
    desc.className = "option-desc";
    desc.textContent = opt.description;
    card.appendChild(desc);

    const frame = document.createElement("div");
    frame.className = "preview-frame";
    const canvas = document.createElement("canvas");
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;
    frame.appendChild(canvas);
    card.appendChild(frame);

    const status = document.createElement("p");
    status.className = "preview-status";
    status.textContent = "Loading a live preview…";
    card.appendChild(status);

    const useBtn = document.createElement("a");
    useBtn.className = "use-this-btn";
    useBtn.textContent = "Use This";
    const target = new URLSearchParams();
    if (deviceId) target.set("id", deviceId);
    target.set("screen", String(screen));
    target.set("localInfoChoice", opt.subType);
    useBtn.href = "index.html?" + target.toString();
    card.appendChild(useBtn);

    optionList.appendChild(card);

    const ctx = canvas.getContext("2d");
    drawLoadingCard(ctx, "Loading a live preview…");

    opt.load().then((data) => {
      opt.draw(ctx, data);
      status.textContent = "This is a live preview — it's pulling today's real data right now.";
    }).catch((err) => {
      console.error("Couldn't load preview for " + opt.subType + ":", err);
      drawLoadingCard(ctx, "Couldn't load a live preview right now");
      status.textContent = "Couldn't load a live preview right now (" + err.message + "), but you can still pick this option.";
    });
  });
</script>

</body>
</html>
